name: Publish Node.js Package

on:
    release:
        types: [created]

# id-token: write is required for npm trusted publishing (OIDC)
permissions:
    contents: read
    id-token: write

jobs:
    publish-npm-package:
        runs-on: ubuntu-latest
        # Waits for a reviewer to approve before anything runs, so creating a release is not on its own enough to publish.
        environment: release

        steps:
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            # No registry-url here on purpose: it would write an .npmrc with a
            # ${NODE_AUTH_TOKEN} placeholder, and trusted publishing needs no token
            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: "24"

            # Trusted publishing requires npm 11.5.1 or newer. Held to major 11 rather than @latest, so a new npm major does
            # not arrive unreviewed in the one job that can publish.
            - name: Update npm
              run: |
                  npm install -g npm@11
                  npm --version

            # A release whose tag does not name the version in package.json would publish that version under the wrong
            # release, or fail at the registry after everything else has run, so it stops here first.
            - name: Check that the release tag matches package.json
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$version" ]; then
                    echo "::error::The release is tagged $TAG, but package.json says $version."
                    exit 1
                  fi

            # Enable Corepack and activate the Yarn version from package.json
            - name: Enable Corepack & activate Yarn 4
              run: |
                  corepack enable
                  yarn --version

            - name: Install dependencies
              run: yarn install --immutable

            - name: Typecheck
              run: yarn typecheck

            - name: Run tests
              run: yarn test

            - name: Build project
              if: ${{ success() }}
              run: yarn build

            - name: Determine dist-tag
              id: dist_tag
              # The tag reaches the script as an environment variable, not pasted into it, so a tag name cannot run as shell code.
              env:
                  TAG_NAME: ${{ github.event.release.tag_name }}
              run: |
                  if [[ "$TAG_NAME" == *"-"* ]]; then
                    DIST_TAG=$(echo "$TAG_NAME" | sed 's/.*-\([a-zA-Z]*\).*/\1/')
                  else
                    DIST_TAG="latest"
                  fi
                  echo "value=$DIST_TAG" >> $GITHUB_OUTPUT

            # Authentication happens through the trusted publisher configured on npm,
            # which also generates the provenance attestation automatically
            - name: Publish to npm
              if: ${{ success() }}
              run: npm publish --registry https://registry.npmjs.org --tag ${{ steps.dist_tag.outputs.value }}
