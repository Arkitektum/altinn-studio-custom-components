name: Publish GitHub Package

on:
    release:
        types: [created]

# packages to publish with the workflow's own token. No OIDC exchange happens here, so no id-token.
permissions:
    contents: read
    packages: write

jobs:
    publish-github-package:
        runs-on: ubuntu-latest
        # Waits for a reviewer to approve before anything runs, so creating a release is not on its own enough to publish.
        environment: release

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: "24"
                  registry-url: https://npm.pkg.github.com/
                  scope: "@arkitektum"

            # A release whose tag does not name the version in package.json would publish that version under the wrong
            # release, or fail at the registry after everything else has run, so it stops here first.
            - name: Check that the release tag matches package.json
              env:
                  TAG: ${{ github.event.release.tag_name }}
              run: |
                  version="v$(node -p "require('./package.json').version")"
                  if [ "$TAG" != "$version" ]; then
                    echo "::error::The release is tagged $TAG, but package.json says $version."
                    exit 1
                  fi

            # 👇 Ensure Yarn v4 from packageManager is used
            - name: Enable Corepack & activate Yarn 4
              run: |
                  corepack enable
                  yarn --version

            - run: yarn install --immutable
            - run: yarn typecheck
            - run: yarn test
            - run: yarn build

            - name: Determine dist-tag
              id: dist_tag
              # The tag reaches the script as an environment variable, not pasted into it, so a tag name cannot run as shell code.
              env:
                  TAG_NAME: ${{ github.event.release.tag_name }}
              run: |
                  if [[ "$TAG_NAME" == *"-"* ]]; then
                    DIST_TAG=$(echo "$TAG_NAME" | sed 's/.*-\([a-zA-Z]*\).*/\1/')
                  else
                    DIST_TAG="latest"
                  fi
                  echo "value=$DIST_TAG" >> $GITHUB_OUTPUT

            - name: Publish to GitHub Packages
              if: ${{ success() }}
              run: npm publish --tag ${{ steps.dist_tag.outputs.value }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
